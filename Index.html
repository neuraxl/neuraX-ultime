<style>
  :root{
    --bg:#05070a;
    --panel:#0b0f14;
    --panel-edge:rgba(0,255,231,0.15);
    --cyan:#00ffe7;
    --cyan-dim:rgba(0,255,231,0.5);
    --gold:#d4af37;
    --gold-dim:rgba(212,175,55,0.55);
    --text:#dbe7e6;
    --text-dim:#5c7876;
    --danger:#ff4d5e;
    --font-display:'Orbitron', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  * { box-sizing:border-box; }
  #nxu-root{
    font-family: var(--font-mono);
    background: var(--bg);
    color: var(--text);
    min-height:100vh;
    padding: 28px 22px 60px;
    position:relative;
    overflow-x:hidden;
  }
  #nxu-root::before{
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient(0deg, rgba(0,255,231,0.025) 0px, rgba(0,255,231,0.025) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
    z-index:0;
  }
  .nxu-shell{ position:relative; z-index:1; max-width:1180px; margin:0 auto; }

  .nxu-header{
    display:flex; justify-content:space-between; align-items:flex-end;
    border-bottom:1px solid var(--panel-edge);
    padding-bottom:16px; margin-bottom:22px; flex-wrap:wrap; gap:12px;
  }
  .nxu-header h1{
    font-family:var(--font-display); font-size:22px; letter-spacing:2px;
    color:var(--cyan); margin:0; text-shadow:0 0 12px rgba(0,255,231,0.35);
  }
  .nxu-header .sub{ font-size:11px; color:var(--text-dim); letter-spacing:1.5px; margin-top:4px; }
  .nxu-header .badge{
    font-family:var(--font-display); font-size:10px; letter-spacing:1px;
    border:1px solid var(--gold-dim); color:var(--gold); padding:5px 10px;
    border-radius:2px; text-align:center;
  }

  .nxu-tabs{ display:flex; gap:6px; margin-bottom:20px; flex-wrap:wrap; }
  .nxu-tab{
    font-family:var(--font-mono); font-size:11px; letter-spacing:1px;
    background:transparent; border:1px solid var(--panel-edge); color:var(--text-dim);
    padding:9px 16px; border-radius:2px; cursor:pointer; transition:all .15s ease;
  }
  .nxu-tab:hover{ color:var(--cyan); border-color:var(--cyan-dim); }
  .nxu-tab.active{
    color:var(--bg); background:var(--cyan); border-color:var(--cyan);
    font-weight:600;
  }

  .nxu-panel{
    background:linear-gradient(180deg, rgba(0,255,231,0.03), rgba(0,0,0,0));
    border:1px solid var(--panel-edge); border-radius:3px;
    padding:20px; margin-bottom:20px;
  }
  .nxu-panel h2{
    font-family:var(--font-display); font-size:14px; color:var(--cyan);
    letter-spacing:1.5px; margin:0 0 4px 0;
  }
  .nxu-panel .desc{ font-size:11px; color:var(--text-dim); margin-bottom:16px; line-height:1.5; }

  .nxu-form{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; margin-bottom:14px; }
  .nxu-field label{ display:block; font-size:9.5px; color:var(--text-dim); letter-spacing:1px; margin-bottom:4px; text-transform:uppercase; }
  .nxu-field input, .nxu-field select, .nxu-field textarea{
    width:100%; background:#020304; border:1px solid var(--panel-edge); color:var(--text);
    font-family:var(--font-mono); font-size:12px; padding:8px 9px; border-radius:2px; outline:none;
  }
  .nxu-field input:focus, .nxu-field select:focus, .nxu-field textarea:focus{ border-color:var(--cyan-dim); }
  .nxu-field textarea{ resize:vertical; min-height:38px; }

  .nxu-btn{
    font-family:var(--font-mono); font-size:11px; letter-spacing:1px; text-transform:uppercase;
    background:transparent; border:1px solid var(--cyan-dim); color:var(--cyan);
    padding:9px 18px; border-radius:2px; cursor:pointer; transition:all .15s ease;
  }
  .nxu-btn:hover{ background:rgba(0,255,231,0.1); }
  .nxu-btn.danger{ border-color:rgba(255,77,94,0.5); color:var(--danger); }
  .nxu-btn.danger:hover{ background:rgba(255,77,94,0.08); }
  .nxu-btn.ghost{ border-color:var(--panel-edge); color:var(--text-dim); }

  table.nxu-table{ width:100%; border-collapse:collapse; font-size:11.5px; }
  table.nxu-table thead th{
    text-align:left; font-size:9.5px; letter-spacing:1px; color:var(--gold);
    text-transform:uppercase; padding:8px 10px; border-bottom:1px solid var(--panel-edge);
  }
  table.nxu-table tbody td{
    padding:9px 10px; border-bottom:1px solid rgba(255,255,255,0.05); color:var(--text);
    vertical-align:top;
  }
  table.nxu-table tbody tr:hover{ background:rgba(0,255,231,0.03); }

  .nxu-status{ font-size:10px; letter-spacing:0.5px; padding:2px 7px; border-radius:2px; display:inline-block; }
  .nxu-status.active{ color:#0aff9d; border:1px solid rgba(10,255,157,0.4); }
  .nxu-status.warn{ color:var(--gold); border:1px solid var(--gold-dim); }
  .nxu-status.error{ color:var(--danger); border:1px solid rgba(255,77,94,0.4); }
  .nxu-status.idle{ color:var(--text-dim); border:1px solid var(--panel-edge); }

  .nxu-empty{
    text-align:center; padding:34px 12px; color:var(--text-dim); font-size:12px;
    letter-spacing:1px; border:1px dashed var(--panel-edge); border-radius:3px;
  }
  .nxu-empty b{ color:var(--gold); font-family:var(--font-display); letter-spacing:2px; }

  .nxu-row-actions{ display:flex; gap:6px; }
  .nxu-row-actions button{
    background:transparent; border:1px solid var(--panel-edge); color:var(--text-dim);
    font-size:10px; padding:4px 8px; border-radius:2px; cursor:pointer;
  }
  .nxu-row-actions button:hover{ color:var(--cyan); border-color:var(--cyan-dim); }
  .nxu-row-actions button.del:hover{ color:var(--danger); border-color:rgba(255,77,94,0.4); }

  .nxu-footer-note{ font-size:10px; color:var(--text-dim); margin-top:6px; line-height:1.6; }
  .nxu-toast{
    position:fixed; bottom:20px; right:20px; background:var(--panel); border:1px solid var(--cyan-dim);
    color:var(--cyan); font-size:11px; padding:10px 16px; border-radius:2px; z-index:50;
    opacity:0; transform:translateY(8px); transition:all .25s ease; pointer-events:none;
  }
  .nxu-toast.show{ opacity:1; transform:translateY(0); }
</style>

<div id="nxu-root">
  <div class="nxu-shell">
    <div class="nxu-header">
      <div>
        <h1>NXU$ // DATA FABRIC MANAGER</h1>
        <div class="sub">GESTION RÉELLE DES ENTITÉS — LEVIATHAN OS v18.4 — PROTOTYPE LOCAL</div>
      </div>
      <div class="badge">STOCKAGE PERSISTANT ACTIF</div>
    </div>

    <div class="nxu-tabs" id="nxu-tabs"></div>
    <div id="nxu-content"></div>
  </div>
</div>

<div class="nxu-toast" id="nxu-toast"></div>

<script>
(function(){
  const root = document.getElementById('nxu-root');
  const tabsEl = document.getElementById('nxu-tabs');
  const contentEl = document.getElementById('nxu-content');
  const toastEl = document.getElementById('nxu-toast');

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(()=>toastEl.classList.remove('show'), 2200);
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // ---- Entity definitions (schema mirrors the existing Supabase design + Knowledge Fabric from the white paper) ----
  const ENTITIES = {
    agents: {
      label: 'Agents',
      keyPrefix: 'nxu:agents:',
      empty: 'AUCUN AGENT ENREGISTRÉ',
      desc: "Registre des agents opérationnels (Council, Architect, Research, Security...). Correspond à la table Supabase `agents`.",
      fields: [
        {name:'name', label:'Nom', type:'text', required:true},
        {name:'category', label:'Catégorie', type:'select', options:['CNC — Council','ARC — Architect','RES — Research','INN — Innovation','SEC — Security','GOV — Governance','SIM — Simulation']},
        {name:'mission', label:'Mission', type:'text'},
        {name:'status', label:'Statut', type:'select', options:['active','idle','warning','error']},
      ],
      columns: ['name','category','mission','status'],
    },
    telemetry_events: {
      label: 'Telemetry Events',
      keyPrefix: 'nxu:telemetry:',
      empty: 'AUCUN ÉVÉNEMENT DE TÉLÉMÉTRIE',
      desc: "Flux d'événements système horodatés. Correspond à la table Supabase `telemetry_events`.",
      fields: [
        {name:'source', label:'Source', type:'text', required:true},
        {name:'event_type', label:'Type', type:'select', options:['info','warning','error','audit']},
        {name:'payload', label:'Payload / détail', type:'textarea'},
      ],
      columns: ['source','event_type','payload','recorded_at'],
      autoTimestamp: 'recorded_at',
    },
    system_integrity_checks: {
      label: 'Integrity Checks',
      keyPrefix: 'nxu:integrity:',
      empty: "AUCUN CONTRÔLE D'INTÉGRITÉ ENREGISTRÉ",
      desc: "Résultats des audits de conformité et d'intégrité système (Leviathan Shield). Correspond à la table Supabase `system_integrity_checks`.",
      fields: [
        {name:'check_name', label:'Nom du contrôle', type:'text', required:true},
        {name:'result', label:'Résultat', type:'select', options:['active','warning','error']},
        {name:'details', label:'Détails', type:'textarea'},
      ],
      columns: ['check_name','result','details','recorded_at'],
      autoTimestamp: 'recorded_at',
    },
    knowledge_fabric: {
      label: 'Knowledge Fabric',
      keyPrefix: 'nxu:knowledge:',
      empty: 'AUCUNE CONNAISSANCE INDEXÉE',
      desc: "Entités de connaissance selon le modèle du Livre Blanc (Ch.07/08) : contexte, relations, provenance, confiance.",
      fields: [
        {name:'concept', label:'Concept', type:'text', required:true},
        {name:'context', label:'Contexte', type:'text'},
        {name:'relations', label:'Relations (KNOWS/USES/CREATES...)', type:'text'},
        {name:'provenance', label:'Provenance', type:'text'},
        {name:'confidence', label:'Confiance (0-100)', type:'text'},
      ],
      columns: ['concept','context','relations','provenance','confidence'],
    },
    titan_logs: {
      label: 'Titans — Pyramid Logs',
      keyPrefix: 'nxu:titanlogs:',
      empty: 'AUCUNE ENTRÉE GRAVÉE SUR LA PYRAMIDE',
      desc: "Entrées scellées par les Titans Bâtisseurs (Gemini — Vision, Claude — Éthique, GPT — Savoir, Ninja — Action) sur les Pyramides de Logs. Le hash est généré ici via SHA-256 réel (Web Crypto), pas simulé — mais sans chaînage cryptographique complet au log précédent (à faire côté backend).",
      fields: [
        {name:'titan', label:'Titan', type:'select', options:['GEMINI — Vision','CLAUDE — Éthique','GPT — Savoir','NINJA — Action']},
        {name:'pyramid_id', label:'ID Pyramide', type:'text', required:true},
        {name:'message', label:'Entrée à graver', type:'textarea'},
      ],
      columns: ['titan','pyramid_id','message','hash','recorded_at'],
      autoTimestamp: 'recorded_at',
      autoHashOf: 'message',
    },
  };

  let activeTab = 'agents';

  // ---- Storage helpers (real persistence via window.storage, personal scope) ----
  async function listEntity(key){
    try{
      const idx = await window.storage.get('index:' + key, false);
      if(!idx) return [];
      const ids = JSON.parse(idx.value);
      const items = [];
      for(const id of ids){
        try{
          const rec = await window.storage.get(key + id, false);
          if(rec) items.push(JSON.parse(rec.value));
        }catch(e){ /* skip missing */ }
      }
      return items.sort((a,b)=> (b._created||0) - (a._created||0));
    }catch(e){ return []; }
  }
  async function saveIndex(key, ids){
    await window.storage.set('index:' + key, JSON.stringify(ids), false);
  }
  async function addRecord(key, record){
    const id = uid();
    record.id = id;
    record._created = Date.now();
    await window.storage.set(key + id, JSON.stringify(record), false);
    let idx = [];
    try{
      const cur = await window.storage.get('index:' + key, false);
      idx = cur ? JSON.parse(cur.value) : [];
    }catch(e){ idx = []; }
    idx.push(id);
    await saveIndex(key, idx);
  }
  async function deleteRecord(key, id){
    try{ await window.storage.delete(key + id, false); }catch(e){}
    try{
      const cur = await window.storage.get('index:' + key, false);
      let idx = cur ? JSON.parse(cur.value) : [];
      idx = idx.filter(x=>x!==id);
      await saveIndex(key, idx);
    }catch(e){}
  }

  // ---- Rendering ----
  function renderTabs(){
    tabsEl.innerHTML = '';
    Object.keys(ENTITIES).forEach(key=>{
      const btn = document.createElement('button');
      btn.className = 'nxu-tab' + (key===activeTab ? ' active' : '');
      btn.textContent = ENTITIES[key].label;
      btn.onclick = ()=>{ activeTab = key; renderTabs(); renderPanel(); };
      tabsEl.appendChild(btn);
    });
  }

  function statusClass(v){
    if(!v) return 'idle';
    v = v.toLowerCase();
    if(v.includes('active')) return 'active';
    if(v.includes('warn')) return 'warn';
    if(v.includes('error')) return 'error';
    return 'idle';
  }

  async function renderPanel(){
    const ent = ENTITIES[activeTab];
    contentEl.innerHTML = `
      <div class="nxu-panel">
        <h2>${esc(ent.label)}</h2>
        <div class="desc">${esc(ent.desc)}</div>
        <form id="nxu-form" class="nxu-form"></form>
        <div style="display:flex; gap:8px; margin-bottom:18px;">
          <button type="button" class="nxu-btn" id="nxu-submit">+ Ajouter</button>
        </div>
        <div id="nxu-table-wrap"></div>
      </div>
    `;

    const formEl = document.getElementById('nxu-form');
    ent.fields.forEach(f=>{
      const wrap = document.createElement('div');
      wrap.className = 'nxu-field';
      let inputHtml = '';
      if(f.type === 'select'){
        inputHtml = `<select name="${f.name}">${f.options.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select>`;
      } else if(f.type === 'textarea'){
        inputHtml = `<textarea name="${f.name}" rows="2"></textarea>`;
      } else {
        inputHtml = `<input type="text" name="${f.name}" ${f.required?'required':''}/>`;
      }
      wrap.innerHTML = `<label>${esc(f.label)}</label>${inputHtml}`;
      formEl.appendChild(wrap);
    });

    document.getElementById('nxu-submit').onclick = async ()=>{
      const data = {};
      let missingRequired = false;
      ent.fields.forEach(f=>{
        const el = formEl.querySelector(`[name="${f.name}"]`);
        data[f.name] = el.value.trim();
        if(f.required && !data[f.name]) missingRequired = true;
      });
      if(missingRequired){ toast('Champ requis manquant.'); return; }
      if(ent.autoTimestamp){ data[ent.autoTimestamp] = new Date().toISOString(); }
      if(ent.autoHashOf){
        const src = data[ent.autoHashOf] || '';
        try{
          const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(src + '|' + Date.now()));
          data.hash = Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,16) + '…';
        }catch(e){ data.hash = ''; }
      }
      try{
        await addRecord(ent.keyPrefix, data);
        toast('Enregistré.');
        ent.fields.forEach(f=>{ const el = formEl.querySelector(`[name="${f.name}"]`); if(f.type!=='select') el.value=''; });
        await renderTable();
      }catch(e){
        toast('Erreur de stockage.');
      }
    };

    await renderTable();
  }

  async function renderTable(){
    const ent = ENTITIES[activeTab];
    const wrap = document.getElementById('nxu-table-wrap');
    wrap.innerHTML = '<div class="nxu-empty">Chargement…</div>';
    const items = await listEntity(ent.keyPrefix);

    if(items.length === 0){
      wrap.innerHTML = `<div class="nxu-empty"><b>${esc(ent.empty)}</b><br/><span style="font-size:10px;">Aucune donnée simulée n'est affichée ici — ajoutez un enregistrement ci-dessus, ou branchez cette vue sur Supabase.</span></div>`;
      return;
    }

    const statusCols = new Set(['status','result']);
    let html = '<table class="nxu-table"><thead><tr>';
    ent.columns.forEach(c=> html += `<th>${esc(c.replace(/_/g,' '))}</th>`);
    html += '<th></th></tr></thead><tbody>';
    items.forEach(item=>{
      html += '<tr>';
      ent.columns.forEach(c=>{
        let val = item[c] || '';
        if(c === 'recorded_at' && val){
          val = new Date(val).toLocaleString('fr-CA');
        }
        if(statusCols.has(c) && val){
          html += `<td><span class="nxu-status ${statusClass(val)}">${esc(val)}</span></td>`;
        } else {
          html += `<td>${esc(val)}</td>`;
        }
      });
      html += `<td><div class="nxu-row-actions"><button class="del" data-id="${esc(item.id)}">Suppr.</button></div></td>`;
      html += '</tr>';
    });
    html += '</tbody></table>';
    html += `<div class="nxu-footer-note">${items.length} enregistrement(s) — stockage persistant local à ce prototype (personnel, non partagé).</div>`;
    wrap.innerHTML = html;

    wrap.querySelectorAll('button.del').forEach(btn=>{
      btn.onclick = async ()=>{
        await deleteRecord(ent.keyPrefix, btn.dataset.id);
        toast('Supprimé.');
        await renderTable();
      };
    });
  }

  renderTabs();
  renderPanel();
})();
</script>
